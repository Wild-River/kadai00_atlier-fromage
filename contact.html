    <div class="container mx-auto flex flex-wrap p-5 flex-col md:flex-row items-center">
      <a class="font-medium items-center mb-4 md:mb-0" href="index.html">
        <img src="img/logo_black.webp" alt="Cheese Cake Academy" width="400">
      </a>
      <nav class="md:ml-auto md:mr-auto flex flex-wrap items-center text-xl justify-center font-serif tracking-widest">
        <a class="group mr-8 hover:text-yellow-500 text-center leading-10 inline-flex flex-col"
          href="index.html#lineup">Lineup
          <span class="text-xs text-gray-600 group-hover:text-yellow-500">商品ラインナップ</span>
        </a>
        <a class="group mr-8 hover:text-yellow-500 text-center leading-10 inline-flex flex-col"
          href="index.html#about">About
          <span class="text-xs text-gray-600 group-hover:text-yellow-500">私たちについて</span>
        </a>
        <a class="group mr-8 hover:text-yellow-500 text-center leading-10 inline-flex flex-col"
          href="index.html#information">Information
          <span class="text-xs text-gray-600 group-hover:text-yellow-500">お知らせ</span>
        </a>
        <a class="group hover:text-yellow-500 text-center leading-10 inline-flex flex-col" href="index.html#shop">Shop
          <span class="text-xs text-gray-600 group-hover:text-yellow-500">店舗紹介</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- contact form -->
  <section class="bg-white">
    <div class="py-8 lg:py-16 px-4 mx-auto max-w-screen-md">
      <div class="flex flex-col text-center w-full mb-20">
        <h1 class="sm:text-4xl text-3xl font-medium mb-2 text-gray-900 font-serif tracking-wider">
          Contact</h1>
        <p class="lg:w-2/3 mx-auto text-base text-gray-500">お問い合わせ</p>
      </div>
      <form action="#" class="space-y-8">
        <div>
          <label class="block mb-2 text-md font-medium text-gray-800" for="reason-select">お問い合わせ種別</label>
          <select
            class="block w-full border border-gray-300 bg-gray-50 p-2.5 text-md text-gray-900 shadow-sm focus:border-primary-500 focus:ring-2 focus:ring-primary-200"
            name="reasons" id="reason-select" autocomplete="off">
            <option value="">--- お問い合わせ内容をお選びください ---</option>
            <option value="products">商品について</option>
            <option value="order">ご注文・配送について</option>
            <option value="bulk">ギフト・大口注文</option>
            <option value="business">法人・取材・コラボ</option>
            <option value="other">その他</option>
          </select>
        </div>
        <div>
          <label for="name" class="block mb-2 text-md font-medium text-gray-900">お名前</label>
          <input type="text" id="name" name="name"
            class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-md focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5"
            placeholder="" required />
        </div>
        <div>
          <label for="kana" class="block mb-2 text-md font-medium text-gray-900">カナ</label>
          <input type="text" id="kana" name="kana"
            class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-md focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5"
            placeholder="" required />
        </div>
        <div>
          <label for="email" class="block mb-2 text-md font-medium text-gray-900">メールアドレス</label>
          <input type="email" id="email" name="email"
            class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-md focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5"
            placeholder="" required />
        </div>
        <div>
          <label for="tel" class="block mb-2 text-md font-medium text-gray-900">電話番号</label>
          <input type="text" id="tel" name="tel"
            class="block p-3 w-full text-md text-gray-900 bg-gray-50 border border-gray-300 shadow-sm focus:ring-primary-500 focus:border-primary-500"
            placeholder="" />
        </div>
        <fieldset class="space-y-3">
          <legend class="mb-2 text-md font-medium text-gray-800">アトリエフロマージュを知ったきっかけ</legend>
          <div class="space-y-2">
            <p>
              <label class="flex items-center gap-2 text-md text-gray-700" for="sns">
                <input class="h-4 w-4 accent-yellow-950" type="checkbox" id="sns" name="sns" />
                SNS
              </label>
            </p>
            <p>
              <label class="flex items-center gap-2 text-md text-gray-700" for="ads">
                <input class="h-4 w-4 accent-yellow-950" type="checkbox" id="ads" name="ads" />
                WEB広告
              </label>
            </p>
            <p>
              <label class="flex items-center gap-2 text-md text-gray-700" for="friend">
                <input class="h-4 w-4 accent-yellow-950" type="checkbox" id="friend" name="friend" />
                友人・知人から
              </label>
            </p>
            <p>
              <label class="flex items-center gap-2 text-md text-gray-700" for="other">
                <input class="h-4 w-4 accent-yellow-950" type="checkbox" id="other" name="other" />
                その他
              </label>
            </p>
          </div>
        </fieldset>
        <div class="sm:col-span-2">
          <label for="message" class="block mb-2 text-md font-medium text-gray-900">詳細</label>
          <textarea id="message" rows="6" name="message"
            class="block p-2.5 w-full text-md text-gray-900 bg-gray-50 shadow-sm border border-gray-300 focus:ring-primary-500 focus:border-primary-500 "
            placeholder=""></textarea>
        </div>
        <div class="text-center">
          <button type="submit"
            class="bg-yellow-500 border-0 py-3 px-6 focus:outline-none hover:bg-yellow-950 transition rounded text-xl text-white mt-4">送信する</button>
        </div>
      </form>
    </div>
  </section>
